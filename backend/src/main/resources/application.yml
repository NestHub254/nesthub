server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${NESTHUB_DB_URL:}
    username: ${NESTHUB_DB_USERNAME:}
    password: ${NESTHUB_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  jwt:
    secret: ${NESTHUB_JWT_SECRET:}
    expiration-minutes: 60

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
